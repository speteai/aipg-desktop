<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIPG Quick prompt</title>
<style>
  html,body{margin:0;height:100%;background:#151412;color:#f1ede4;overflow:hidden;
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  .q{display:flex;align-items:center;gap:12px;height:100%;padding:0 16px;box-sizing:border-box;
    border:1px solid #ff9a00}
  img{width:26px;height:26px;flex:0 0 auto}
  input{flex:1;min-width:0;background:none;border:0;outline:none;color:inherit;font:inherit;font-size:17px}
  input::placeholder{color:#8a857a}
  kbd{flex:0 0 auto;font:11px/1 ui-monospace,Consolas,monospace;color:#8a857a;
    border:1px solid #3a3731;padding:4px 6px}
</style>
</head>
<body>
  <div class="q">
    <img src="aipg-logo.png" alt="">
    <input id="q" type="text" placeholder="Ask the grid…" autocomplete="off" spellcheck="false">
    <kbd>Enter</kbd><kbd>Esc</kbd>
  </div>
  <script src="quick.js"></script>
</body>
</html>
