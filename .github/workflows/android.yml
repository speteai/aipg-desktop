name: android-probe
# Feasibility probe: does the app build for Android from the same code?
# Produces a debug-signed test APK as a workflow artifact. Not a release.
on:
  push:
    branches: [android-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          key: android
      - name: Point Tauri at the preinstalled NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_NDK_LATEST_HOME" | head
      - name: Install frontend deps
        run: npm ci
      - name: Generate the Android project
        run: npm run tauri android init -- --ci --skip-targets-install
      - name: Generate icons
        run: npm run tauri icon app-icon.png
      - name: Build debug APKs (one per CPU type)
        env:
          # debug builds carry full debug symbols: about 210 MB per CPU type.
          # Without them the APK is small enough to send to a phone.
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_DEV_STRIP: 'true'
        run: npm run tauri android build -- --debug --apk --split-per-abi --target aarch64 --target x86_64
      - name: List outputs
        run: find src-tauri/gen/android/app/build/outputs -name '*.apk' -exec ls -la {} +
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aipg-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  emulator:
    # does the app start, and what does the first screen look like?
    needs: apk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aipg-android-debug-apk
          path: apk
      - name: Allow hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the smoke script
        run: |
          cat > smoke.sh <<'SH'
          set -x
          mkdir -p out
          APK=$(find apk -name '*x86_64*.apk' | head -1)
          adb install "$APK"
          adb logcat -c
          adb shell monkey -p io.github.speteai.aipgdesktop -c android.intent.category.LAUNCHER 1
          sleep 40
          adb exec-out screencap -p > out/start.png
          adb shell pidof io.github.speteai.aipgdesktop > out/pid.txt || echo "NOT RUNNING" > out/pid.txt
          adb shell wm size > out/size.txt
          adb logcat -d > out/logcat.txt
          grep -iE 'FATAL|AndroidRuntime|panicked|Tauri|chromium|Console' out/logcat.txt | tail -80 > out/logcat-short.txt || true
          cat out/pid.txt
          SH
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: aipg-android-emulator-smoke
          path: out

  desktop:
    # the same branch must still build for the desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend deps
        run: npm ci
      - name: Generate icons
        run: npm run tauri icon app-icon.png
      - name: Build (compile check, no bundle)
        run: npm run tauri build -- --no-bundle -- --locked
