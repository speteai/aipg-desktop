name: android-probe
# Feasibility probe: does the app build for Android from the same code?
# Produces release APKs, signed with the project's Android key, as a workflow artifact.
on:
  push:
    branches: [android-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          key: android
      - name: Point Tauri at the preinstalled NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_NDK_LATEST_HOME" | head
      - name: Install frontend deps
        run: npm ci
      - name: Generate the Android project
        run: npm run tauri android init -- --ci --skip-targets-install
      - name: Generate icons
        run: npm run tauri icon app-icon.png
      - name: Use our MainActivity (keeps the page clear of system bars and keyboard)
        run: |
          f=$(find src-tauri/gen/android/app/src/main -name MainActivity.kt)
          echo "replacing $f"; cat "$f"
          cp src-tauri/android/MainActivity.kt "$f"
      - name: Dark window and start screen (no white flash before the page is drawn)
        run: |
          for f in $(find src-tauri/gen/android/app/src/main/res -name themes.xml); do
            sed -i 's|<!-- Customize your theme here. -->|<item name="android:windowBackground">#141311</item><item name="android:windowSplashScreenBackground" tools:targetApi="31">#141311</item>|' "$f"
            echo "$f"; cat "$f"
          done
      - name: Keep app data (API key, sign-in) out of device backups
        run: |
          m=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:allowBackup="false"/' "$m"
          grep -n 'allowBackup' "$m"
      - name: Build release APKs (one per CPU type)
        run: npm run tauri android build -- --apk --split-per-abi --target aarch64 --target x86_64
      - name: Sign with the release key
        env:
          KS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec ls -la {} +
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          mkdir -p dist-apk
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk'); do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release.*\.apk$/\1/')
            "$BT/zipalign" -f -p 4 "$f" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type pkcs12 --ks-pass env:KS_PASS --ks-key-alias aipg \
              --out "dist-apk/aipg-mobile-$abi.apk" "$RUNNER_TEMP/aligned.apk"
            echo "aipg-mobile-$abi.apk"; "$BT/apksigner" verify --print-certs "dist-apk/aipg-mobile-$abi.apk" | grep -i 'SHA-256'
          done
          rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/aligned.apk" dist-apk/*.idsig
          ls -la dist-apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aipg-android-apk
          path: dist-apk/*.apk
          if-no-files-found: error

  emulator:
    # does the app start, and what does the first screen look like?
    needs: apk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aipg-android-apk
          path: apk
      - name: Allow hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false   # the start logo pulses only when animations are on
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: aipg-android-emulator-smoke
          path: out

  desktop:
    # the same branch must still build for the desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend deps
        run: npm ci
      - name: Generate icons
        run: npm run tauri icon app-icon.png
      - name: Build (compile check, no bundle)
        run: npm run tauri build -- --no-bundle -- --locked
